# Publishes to crates.io via Trusted Publishing (OIDC) — no API token is
# stored in this repository. Setup: https://crates.io/docs/trusted-publishing
#
# crates.io must be configured to trust this workflow:
#   Crate Settings -> Trusted Publishing -> Add -> GitHub
#     Repository owner: xczimi
#     Repository name:  ynab-cli
#     Workflow filename: release.yml
#     Environment:       release
#
# Third-party actions are pinned by commit SHA, not by tag: a tag can be
# moved, and this workflow holds publish rights to the crate.
name: Publish to crates.io

on:
  push:
    tags: ['v*']

permissions: {}

env:
  # Matches the toolchain pinned in mise.toml.
  RUST_VERSION: 1.95.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      # A tag that disagrees with Cargo.toml would publish the wrong version
      # under the right name, and crates.io releases cannot be undone.
      - name: Tag must match the crate version
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME implies $tag_version, Cargo.toml says $crate_version" >&2
            exit 1
          fi
          echo "publishing $crate_version"

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    # Separate job so `id-token: write` is never held while building or
    # running test code — only these three steps can mint a crates.io token.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
