[package]
name = "ynab-cli"
version = "0.1.0"
edition = "2024"
description = "Absolutely read-only CLI for the YNAB API with first-class MCP support, in the spirit of google-readonly (gro)."
license = "MIT"
repository = "https://github.com/xczimi/ynab-cli"

[[bin]]
name = "ynab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
secrecy = "0.10"
toml = "0.8"
directories = "6"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
